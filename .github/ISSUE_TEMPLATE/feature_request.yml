name: Feature request
description: Suggest a new rule, ecosystem, or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New cache rule
        - New language/ecosystem
        - Output format / integration
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Include an example Dockerfile if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
