name: Release

# Publishes to PyPI when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Setup (one time): on PyPI, add this repo as a Trusted Publisher for the
# "cachelint" project (https://docs.pypi.org/trusted-publishers/). No API token
# is then needed. Alternatively, set a PYPI_API_TOKEN secret and add
# `with: { password: ${{ secrets.PYPI_API_TOKEN }} }` to the publish step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
