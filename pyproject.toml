[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cachelint"
version = "0.1.0"
description = "Predict Docker build-cache invalidation and suggest a faster layer order."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cachelint contributors" }]
keywords = ["docker", "dockerfile", "cache", "ci", "linter", "build", "devops", "buildkit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []  # zero runtime dependencies; pure standard library

[project.urls]
Homepage = "https://github.com/0xABCD01/cachelint"
Issues = "https://github.com/0xABCD01/cachelint/issues"

[project.scripts]
cachelint = "cachelint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
